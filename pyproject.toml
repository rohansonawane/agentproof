[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentproof-sim"
version = "0.1.1"
description = "Stateful simulation and fault-injection testing for AI agents that take actions through tools."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Rohan Sonawane", email = "rohansonawane28@gmail.com" }]
keywords = ["agents", "testing", "reliability", "fault-injection", "simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "click>=8.1,<9",
  "pydantic>=2.12,<3",
  "rich>=13,<16",
]

[project.optional-dependencies]
openai = ["openai-agents>=0.22,<1", "httpx2[brotli]>=2.12,<3"]
langchain = ["langchain>=1.3,<2", "langgraph>=1.2,<2"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-cov>=5,<8"]
dev = [
  "agentproof-sim[test,openai,langchain]",
  "build>=1.2,<2",
  "mypy>=1.13,<2",
  "ruff>=0.8,<1",
  "twine>=7,<8",
]

[project.urls]
Homepage = "https://github.com/rohansonawane/agentproof"
Documentation = "https://github.com/rohansonawane/agentproof/tree/main/docs"
Issues = "https://github.com/rohansonawane/agentproof/issues"

[project.scripts]
agentproof = "agentproof.cli:main"

[project.entry-points.pytest11]
agentproof = "agentproof.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/agentproof"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
  "agentproof: tests that exercise AgentProof suites",
  "live: opt-in tests that may call remote model providers",
  "openai: tests for OpenAI Agents SDK integration",
  "langchain: tests for LangChain/LangGraph integration",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["AGENTPROOF_CODEX_BUILD_SPEC.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "UP013"]

[tool.mypy]
python_version = "3.11"
packages = ["agentproof"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
