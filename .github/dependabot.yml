version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    groups:
      python-runtime:
        patterns:
          - "pydantic"
          - "click"
          - "rich"
      python-dev:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "build"
          - "twine"
      framework-adapters:
        patterns:
          - "openai-agents"
          - "langchain"
          - "langgraph"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
